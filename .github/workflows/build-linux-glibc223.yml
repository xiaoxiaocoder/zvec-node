name: Build Linux Node Bindings for glibc 2.23

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ldd223

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-linux-bindings:
    name: Build .node (${{ matrix.arch }}, glibc 2.17+)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
            image: quay.io/pypa/manylinux2014_x86_64
            node_url: https://nodejs.org/dist/v16.17.0/node-v16.17.0-linux-x64.tar.xz
            cmake_url: https://cmake.org/files/v3.27/cmake-3.27.9-linux-x86_64.tar.gz
          - arch: arm64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux2014_aarch64
            node_url: https://nodejs.org/dist/v16.17.0/node-v16.17.0-linux-arm64.tar.xz
            cmake_url: https://cmake.org/files/v3.27/cmake-3.27.9-linux-aarch64.tar.gz
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Linux build dependencies
        uses: actions/cache@v4
        with:
          path: |
            .cache/linux-glibc/${{ matrix.arch }}/npm
            .cache/linux-glibc/${{ matrix.arch }}/cmake-js
            .cache/linux-glibc/${{ matrix.arch }}/tools
            .cache/linux-glibc/${{ matrix.arch }}/ccache
          key: linux-glibc-${{ matrix.arch }}-${{ hashFiles('package-lock.json', 'CMakeLists.txt', 'src/**/*.cc', 'src/**/*.h', 'src/**/*.js') }}
          restore-keys: |
            linux-glibc-${{ matrix.arch }}-

      - name: Build binding in manylinux2014
        run: |
          mkdir -p \
            .cache/linux-glibc/${{ matrix.arch }}/npm \
            .cache/linux-glibc/${{ matrix.arch }}/cmake-js \
            .cache/linux-glibc/${{ matrix.arch }}/tools \
            .cache/linux-glibc/${{ matrix.arch }}/ccache
          docker run --rm \
            -v "$PWD:/work" \
            -v "$PWD/.cache/linux-glibc/${{ matrix.arch }}/npm:/cache/npm" \
            -v "$PWD/.cache/linux-glibc/${{ matrix.arch }}/cmake-js:/cache/cmake-js" \
            -v "$PWD/.cache/linux-glibc/${{ matrix.arch }}/tools:/cache/tools" \
            -v "$PWD/.cache/linux-glibc/${{ matrix.arch }}/ccache:/cache/ccache" \
            -w /work \
            -e HOME=/tmp/zvec-home \
            -e npm_config_cache=/cache/npm \
            -e npm_config_unsafe_perm=true \
            -e CMAKE_JS_CACHE=/cache/cmake-js \
            -e CCACHE_DIR=/cache/ccache \
            -e CCACHE_MAXSIZE=2G \
            -e NODE_URL="${{ matrix.node_url }}" \
            -e CMAKE_URL="${{ matrix.cmake_url }}" \
            ${{ matrix.image }} \
            /bin/bash -lc '
              set -euxo pipefail
              mkdir -p "$HOME/.cmake-js" "$npm_config_cache" "$CMAKE_JS_CACHE" /cache/tools "$CCACHE_DIR"
              chmod -R 777 "$HOME" "$npm_config_cache" "$CMAKE_JS_CACHE" /cache/tools "$CCACHE_DIR"
              yum install -y libaio-devel xz tar gzip make gcc gcc-c++ curl git python3 ccache || yum install -y libaio-devel xz tar gzip make gcc gcc-c++ curl git python3
              if command -v ccache >/dev/null 2>&1; then
                export CMAKE_COMPILER_LAUNCHER=ccache
              fi
              node_archive="/cache/tools/$(basename "$NODE_URL")"
              cmake_archive="/cache/tools/$(basename "$CMAKE_URL")"
              if [ ! -f "$node_archive" ]; then
                curl -sL "$NODE_URL" -o "$node_archive"
              fi
              if [ ! -f "$cmake_archive" ]; then
                curl -sL "$CMAKE_URL" -o "$cmake_archive"
              fi
              tar xJf "$node_archive" -C /usr/local --strip-components=1
              tar xzf "$cmake_archive" -C /usr/local --strip-components=1
              node --version
              npm --version
              cmake --version
              npm install --ignore-scripts
              npm install --no-save cmake-js@7.3.0
              if command -v ccache >/dev/null 2>&1; then ccache --zero-stats; fi
              npm run build
              if command -v ccache >/dev/null 2>&1; then ccache --show-stats; fi
              ldd packages/bindings-linux-${{ matrix.arch }}/zvec_node_binding.node
              if [ -f packages/bindings-linux-${{ matrix.arch }}/libzvec_diskann_plugin.so ]; then
                ldd packages/bindings-linux-${{ matrix.arch }}/libzvec_diskann_plugin.so
              fi
              rm -f zvec_node_binding.node
              test_dir=$(mktemp -d)
              pack_src="$test_dir/bindings-linux-${{ matrix.arch }}"
              cp -a "packages/bindings-linux-${{ matrix.arch }}" "$pack_src"
              pack_file=$(cd "$pack_src" && npm pack)
              npm install --prefix "$test_dir" --ignore-scripts "$pack_src/$pack_file"
              TEST_BINDING_PATH="$test_dir/node_modules/@zvec/bindings-linux-${{ matrix.arch }}" node -e "const binding = require(process.env.TEST_BINDING_PATH); if (!binding.DataType || !binding.CollectionSchema) throw new Error(\"Invalid packaged binding exports\"); console.log(\"packaged binding loaded successfully\")"
            '

      - name: Upload binding artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bindings-linux-${{ matrix.arch }}-glibc217
          path: |
            packages/bindings-linux-${{ matrix.arch }}/zvec_node_binding.node
            packages/bindings-linux-${{ matrix.arch }}/libzvec_diskann_plugin.so
            packages/bindings-linux-${{ matrix.arch }}/jieba_dict/**
          if-no-files-found: error
